<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Catalog · LibraTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar"><span class="logo">Libra<b>Track</b></span></header>
<main class="page">
    <h1>Catalog</h1>
    <form class="search" th:action="@{/books}" method="get">
        <input name="q" th:value="${q}" placeholder="Search by title, author or ISBN…">
        <button class="btn" type="submit">Search</button>
    </form>
    <p th:if="${#lists.isEmpty(books)}" class="muted">No books found.</p>
    <div class="grid">
        <a class="card" th:each="book : ${books}" th:href="@{/books/{id}(id=${book.id})}">
            <strong th:text="${book.title}">Title</strong>
            <div class="muted" th:text="${book.author}">Author</div>
            <span th:if="${book.availableCopies > 0}" class="badge"
                  th:text="${book.availableCopies} + ' available'">available</span>
            <span th:unless="${book.availableCopies > 0}" class="badge out">On loan</span>
        </a>
    </div>
</main>
</body>
</html>
