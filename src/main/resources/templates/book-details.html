<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title th:text="${book.title} + ' · LibraTrack'">Book · LibraTrack</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
</head>
<body>
<header class="topbar"><span class="logo">Libra<b>Track</b></span></header>
<main class="page">
    <p><a th:href="@{/books}">← Back to catalog</a></p>
    <div class="card">
        <h1 th:text="${book.title}">Title</h1>
        <p class="muted" th:text="${book.author}">Author</p>
        <p>ISBN: <span th:text="${book.isbn}"></span></p>
        <p>Shelf: <span th:text="${book.shelfLocation}"></span></p>
        <p>Available: <span th:text="${book.availableCopies} + ' of ' + ${book.totalCopies}"></span></p>
    </div>
</main>
</body>
</html>
